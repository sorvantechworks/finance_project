<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClearPath — Personal Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-orb orb-a"></div><div class="auth-orb orb-b"></div>
    <div class="auth-card">
      <div class="brand auth-brand"><span class="brand-mark">C</span><span>ClearPath</span></div>
      <div id="authLogin">
        <p class="eyebrow">PERSONAL FINANCE</p>
        <h1>Make your money feel simpler.</h1>
        <p class="auth-copy">Track income, essentials, debt and commitments in one private workspace.</p>
        <form id="loginForm" class="stack">
          <label>Email<input id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Your password"></label>
          <button class="btn primary full" type="submit">Sign in</button>
        </form>
        <button class="text-btn" id="showSignup">Create account</button>
        <p id="authError" class="form-error"></p>
      </div>
      <div id="authSignup" class="hidden">
        <p class="eyebrow">NEW ACCOUNT</p>
        <h2>Create your ClearPath account</h2>
        <form id="signupForm" class="stack">
          <label>Name<input id="signupName" required placeholder="Your name"></label>
          <label>Email<input id="signupEmail" type="email" required placeholder="you@example.com"></label>
          <label>Password<input id="signupPassword" type="password" minlength="6" required placeholder="At least 6 characters"></label>
          <button class="btn primary full" type="submit">Create account</button>
        </form>
        <button class="text-btn" id="showLogin">Back to sign in</button>
        <p id="signupError" class="form-error"></p>
      </div>
      <p class="auth-note">Your financial records are tied to your account, not this browser.</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">C</span><span>ClearPath</span></div>
      <div class="user-chip"><div class="avatar" id="avatar">F</div><div><strong id="sideName">Friend</strong><small id="sideEmail"></small></div></div>
      <nav>
        <button data-page="dashboard" class="nav-item active"><span>⌂</span>Overview</button>
        <button data-page="income" class="nav-item"><span>↗</span>Income</button>
        <button data-page="expenses" class="nav-item"><span>▤</span>Living costs</button>
        <button data-page="loans" class="nav-item"><span>◈</span>Loans</button>
        <button data-page="chits" class="nav-item"><span>◌</span>Chits</button>
        <button data-page="debts" class="nav-item"><span>↔</span>Temporary debts</button>
        <button data-page="activity" class="nav-item"><span>◷</span>Activity</button>
        <button data-page="settings" class="nav-item"><span>⚙</span>Settings</button>
      </nav>
      <button id="logoutBtn" class="logout-btn"><span>↪</span> Sign out</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div><span class="top-kicker">PERSONAL WORKSPACE</span><h2 id="pageTitle">Overview</h2></div>
        <div class="top-actions"><select id="monthSelect"></select><button class="icon-btn" id="quickAdd">＋</button></div>
      </header>

      <section class="content">
        <div id="page-dashboard" class="page active"></div>
        <div id="page-income" class="page"></div>
        <div id="page-expenses" class="page"></div>
        <div id="page-loans" class="page"></div>
        <div id="page-chits" class="page"></div>
        <div id="page-debts" class="page"></div>
        <div id="page-activity" class="page"></div>
        <div id="page-settings" class="page"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-backdrop"></div><div class="modal-card"><button class="modal-close" id="modalClose">×</button><div id="modalBody"></div></div></div>
  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
